<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="bsstyle1.css">
</head>
<body>
  <div class="container">
    <h2>Form Demo</h2>
    <form >
        <div class="row">
    <div class="col-md-6 mb-3">
        <label class="form-label" for="email"> Email</label>
    <input type="email" placeholder="email" class="form-control" id="email">
    </div>
   <div class="col-md-6 mb-3">
     <label class="form-label" for="pass"> password</label>
    <input type="password" placeholder="password" class="form-control" id="pass">
   </div>
   </div>
    <label class="form-label" for="add"> add</label>
    <input type="text" placeholder="add" class="form-control-lg" id="add">
    <div class="mb-3">
        <select class="form-select">
            <option selected>Choose your City</option>
            <option value="1">Mumbai</option>
            <option value="2">Delhi</option>
             <option value="3">pune</option>
        </select>
    </div>  
    <div class="normal mb-3">
        
        <input type="checkbox" id="Agree"/>
        <label for="Agree">Agree</label>
    </div> 
    <div class="mb-3 form-check">
        
        <input type="checkbox" class="form-check-input" id="Agree"/>
        <label for="Agree" class="form-check-label">Agree</label>
    </div>
    <div class="mb-3 form-check">
        
        <input type="radio" class="form-check-input" id="Agreebs"/>
        <label for="Agreebs" class="form-check-label">Yes/no</label>
    </div>   
    <div class="form-check form-switch mb-3">
  <input class="form-check-input" type="checkbox" role="switch" id="switchCheckDefault">
  <label class="form-check-label" for="switchCheckDefault">Default switch checkbox input</label>
</div>   
</form>
  </div>
</body>
</html>
