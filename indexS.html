<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simon</title>
    <link rel="stylesheet" href="styleS.css" />
  </head>
  <body>
    <h1>Simon Says Game</h1>
    <h2>Press any key to start the game</h2>
    <div class="butt-Cont">
      <div class="line1">
        <div class="btn red" type="button" id="red" >Box1</div>
        <div class="btn yellow"type="button" id="yellow"> Box2</div>
      </div>
      <!-- <br/> -->
      <div class="line2">
        <div class="btn green" type="button" id="green">Box3</div>
        <div class="btn blue" type="button" id="blue">Box4</div>
      </div>
    </div>
    <script src="simapp.js"></script>
  </body>
</html>
